name: C/C++ CI

on:
  push:
    branches: [ 6.3 ]
  pull_request:
    branches: [ 6.3 ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: apt install
      run: sudo apt-get update && sudo apt-get install -y tree qt6-base-dev qt6-base-dev-tools qt6-multimedia-dev
    - name: Build (qmake release)
      run: |
        mkdir build
        cd build
        qmake6 CONFIG+=release PREFIX=/usr ..
        make -j2
        sudo make install
        ldd /usr/bin/qtfm
        ldd /usr/bin/qtfm-tray
        
